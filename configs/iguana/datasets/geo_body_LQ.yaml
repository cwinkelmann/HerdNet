    sampler: null
    augmentation_multiplier: 1

    albu_transforms:
      HorizontalFlip:
        p: 0.2
      VerticalFlip:
        p: 0.2
      MotionBlur:
        p: 0.2
      RandomRotate90:
        p: 0.5
      RandomBrightnessContrast:
        brightness_limit: 0.2
        contrast_limit: 0.2
        p: 0.1
      Blur:
        blur_limit: 15
        p: 0.1
      ToGray:
        p: 0.1
      #      ShiftScaleRotate:
      #        shift_limit: 0.0625
      #        scale_limit: 0.1
      #        rotate_limit: 45
      #        p: 0.5
      #      Perspective:
      #        scale: 0.05
      #        p: 0.3
      HueSaturationValue:
        hue_shift_limit: 20
        sat_shift_limit: 30
        val_shift_limit: 20
        p: 0.1
      CLAHE:
        clip_limit: 2.0
        p: 0.1
      #      Solarize:
      #        threshold: 128
      #        p: 0.2
#      RandomCrop:
#        height: 512
#        width: 512
#        p: 1.0
      Resize:
        height: 512
        width: 512
        p: 1.0
      Normalize:
        p: 1.0


    end_transforms:
      MultiTransformsWrapper:
        FIDT:
          num_classes: ${datasets.num_classes}
          down_ratio: ${model.kwargs.down_ratio}
        PointsToMask:
          radius: 2
          num_classes: ${datasets.num_classes}
          squeeze: True
          down_ratio: 32

