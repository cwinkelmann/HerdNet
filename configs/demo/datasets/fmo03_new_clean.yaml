# FMO03 new dataset (2026-04-07) — crops WITHOUT hard negatives
# Train: 19 images -> 1430 annotated crops, 2682 iguana annotations
# Val: reuses iguana_hn val patches (347 images, 1178 annotations)

img_size: [512, 512]
anno_type: 'point'
num_classes: 2
collate_fn: null

class_def:
  1: 'iguana'

train:
  name: 'CSVDataset'
  csv_file: '/home/christian/hnee/HerdNet/data_fmo03/train/herdnet_format_512_250_crops.csv'
  root_dir: '/home/christian/hnee/HerdNet/data_fmo03/train/crops_512'
  sampler: null
  augmentation_multiplier: 1

  albu_transforms:
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 0.5
    MotionBlur:
      p: 0.3
    RandomBrightnessContrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.3
    ShiftScaleRotate:
      shift_limit: 0.0625
      scale_limit: 0.1
      rotate_limit: 45
      p: 0.5
    HueSaturationValue:
      hue_shift_limit: 10
      sat_shift_limit: 20
      val_shift_limit: 15
      p: 0.3
    CLAHE:
      clip_limit: 4.0
      p: 0.2
    Normalize:
      p: 1.0

  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 2
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'
  csv_file: '/home/christian/hnee/HerdNet/data_fmo03/val/herdnet_format_512_0_crops.csv'
  root_dir: '/home/christian/hnee/HerdNet/data_fmo03/val/crops_512'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

# Full-size validation — used by tools/infer.py --evaluate after training.
# Identical test set across all augplus/clean variants for fair comparison.
test:
  name: 'CSVDataset'
  csv_file: '/home/christian/hnee/HerdNet/data_fmo03/val/herdnet_format.csv'
  root_dir: '/home/christian/hnee/HerdNet/data_fmo03/val/Default'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}
