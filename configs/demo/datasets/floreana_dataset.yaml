# Small Dataset from Floreana showing how to train and detect

img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 3 # One class more for the background
collate_fn: null

class_def:
  1: 'iguana_point'
  2: 'hard_negative'


train:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/2025_08_10_endgame/Floreana_detection_il_9/train/herdnet_format_512_0_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/2025_08_10_endgame/Floreana_detection_il_9/train/crops_512_num9_overlap0'


  sampler: null
  augmentation_multiplier: 1

  albu_transforms:
    ObjectAwareRandomCrop:
      height: 512
      width: 512
      p: 1.0

    Normalize:
      p: 1.0
  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 2
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/2025_08_10_endgame/Floreana_detection_il_9/train/herdnet_format_512_0_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/2025_08_10_endgame/Floreana_detection_il_9/train/crops_512_num9_overlap0'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

test:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/2025_08_10_endgame/Floreana_detection_il_9/train/herdnet_format_512_0_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/2025_08_10_endgame/Floreana_detection_il_9/train/crops_512_num9_overlap0'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}