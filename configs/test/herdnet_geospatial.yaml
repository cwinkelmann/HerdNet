wandb_project: 'Herdnet_Test'
wandb_entity: 'karisu'
wandb_flag: False
wandb_run: 'myrun'
device_name: 'mps'

model: 
  name: 'HerdNet'
  from_torchvision: False
  # pth_file: '/Users/christian/data/training_data/2024_12_09/2024_12_19_best_model.pth'
  pth_file: '/Users/christian/Downloads/best_model_unknown.pth'
  kwargs:
    num_layers: 34
    pretrained: False
    down_ratio: 2 # was two before
    head_conv: 64

dataset:
  img_size: [512, 512]
  anno_type: 'point'
  num_classes: 7
  collate_fn: null

  class_def:
    1: 'iguana'
    2: 'iguana_point'
    3: 'Warthog'
    4: 'Waterbuck'
    5: 'Elephant'
    6: 'Impala'

  name: 'CSVDataset'
  ## Single Full sized image for debugging
#  csv_file: '/Users/christian/data/training_data/2024_12_09/val/herdnet_format.csv'
#  root_dir: '/Users/christian/data/training_data/2024_12_09/val/Default'

  # Many images
  # csv_file: '/Users/christian/data/training_data/2024_12_09_debug/val_geospatial/herdnet_fake_sample.csv'
  csv_file: '/Users/christian/data/training_data/2025_02_22_HIT/FMO02_full_orthophoto_tiles/herdnet_fake.csv'
  # root_dir: '/Users/christian/data/training_data/2024_12_09_debug/val_geospatial'
  root_dir: '/Users/christian/data/training_data/2025_02_22_HIT/FMO02_full_orthophoto_tiles/'
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

evaluator:
  name: 'HerdNetEvaluator'
  threshold: 15
  kwargs:
    lmds_kwargs:
      kernel_size: [9, 9]
      adapt_ts: 0.5
      # neg_ts: 0.1


stitcher:
  name: 'HerdNetStitcher'
  kwargs:
    overlap: 80
    down_ratio: ${test.model.kwargs.down_ratio}
    up: False # TODO False is Default and necessary for the testing evaluation,
    # up: True # TODO True makes the plotting work
    reduction: 'mean'