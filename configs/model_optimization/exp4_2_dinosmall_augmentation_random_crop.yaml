  - /datasets: delplanque2022_randomcrop_augmentation
  - /training_settings: delplanque2022_val_loss_slow_lr
  - /model: Dinov2_small
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_delplanque2022'
wandb_entity: 'karisu'
wandb_run: 'timm_dinov2_random_crop_augmentation'
