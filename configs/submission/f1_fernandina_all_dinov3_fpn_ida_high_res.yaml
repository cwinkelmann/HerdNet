wandb_notes: |
  fine tune on fernandina reference iguana dataset with timm DinoV3
  Reference FPN fusion model, rest ist default
  trying to get a high recall on Fernandina problematic images
  using 512 upscaling in model
  

defaults:
  - /losses: herdnet_iguana_high_recall
  - /datasets: ig_fernandina_best_aug_default
  - /training_settings: delplanque2022_evaluator_NoStitcher
  - /model: dinov3_fpn_ida
#  - /model: dinov3_fpn
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'x21_opt'
wandb_entity: 'karisu'
wandb_run: 'f1_fernandina_dinov3_fpn_ref'
wandb_tags: ["dino"]
seed: 1
device_name: null


#datasets:
#  train:
#    csv_file: '/raid/cwinkelmann/training_data/iguana/2025_12_02/Fernandina_CVAT_corr/train/herdnet_format_800_160_crops.csv'
#    root_dir: '/raid/cwinkelmann/training_data/iguana/2025_12_02/Fernandina_CVAT_corr/train/crops_800_numNone_overlap160'

training_settings:
  lr: 1.0e-05
  epochs: 50
  batch_size: 5

#losses:
#  FocalLoss:
#    kwargs:
#      alpha: 2
#      beta: 4
#  FastFocalLoss:
#    kwargs:
#      alpha: 2
#      beta: 4

