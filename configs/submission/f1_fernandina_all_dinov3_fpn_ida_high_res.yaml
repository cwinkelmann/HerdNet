model:
  # HerdnetTimmDinV3 high res
#  load_from: /raid/cwinkelmann/herdnet/outputs/2025-12-05/08-58-54/best_model.pth # https://wandb.ai/karisu/x21_opt/runs/q8jh1q6w/logs?nw=nwuserkarisu
#  load_from: /raid/cwinkelmann/herdnet/outputs/2025-12-05/14-53-24/best_model.pth # https://wandb.ai/karisu/x21_opt/runs/nifhmgzu/logs?nw=nwuserkarisu
  kwargs:
    down_ratio: 4
    freeze_backbone: True
  input_resolution: [512, 512]

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

