# Training Data is corrected here by Double Checking them by predictions from a model which are labeles as false positves

img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 3 # One class more for the background
collate_fn: null

class_def:
  1: 'iguana_point'
  2: 'hard_negative' # these next 6 are just there so I can use the pretrained model
#  3: 'Kob'
#  4: 'Warthog'
#  5: 'Waterbuck'
#  6: 'Elephant'
#  7: 'Impala'

train:
  name: 'CSVDataset'


  csv_file: '/raid/cwinkelmann/training_data/iguana/2025_11_12/Fernandina_s_detection/train/herdnet_format_800_160_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/2025_11_12/Fernandina_s_detection/train/crops_800_numNone_overlap160'


  sampler: null
  augmentation_multiplier: 20

  albu_transforms:
    RandomScale:
      scale_limit: [ 0.8, 1.2 ]
      p: 0
    ObjectAwareRandomCrop:
      height: 700
      width: 700
      p: 1.0

    Perspective:
      scale: [ 0.05, 0.15 ]
      p: 0.3
    Affine:
      scale: [ 0.9, 1.1 ]
      translate_percent: [ 0.1, 0.1 ]
      rotate: [ -30, 30 ]
      shear: [ -10, 10 ]
      p: 0.1
    HorizontalFlip:
      p: 0.18166290564499016
    VerticalFlip:
      p: 0.3239315509596778
    RandomRotate90:
      p: 0.4827827101972215

    RandomFog:
      fog_coef_lower: 0.2
      fog_coef_upper: 0.5
      alpha_coef: 0.08
      p: 0.1
    ImageCompression:
      quality_lower: 75
      quality_upper: 95
      compression_type: 0
      p: 0.1
    RandomBrightnessContrast:
      brightness_limit: 0.3
      contrast_limit: 0.3
      p: 0.1

    HueSaturationValue:
      hue_shift_limit: 0
      sat_shift_limit: 20
      val_shift_limit: 15
      p: 0.1
    CLAHE:
      clip_limit: 2.0
      p: 0.1
    ToGray:
      p: 0.1

    ObjectAwareRandomCropEdgeBlackout:
      height: 512
      width: 512
      p: 1.0

    Normalize:
      p: 1.0
  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 1
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/2025_11_12/Fernandina_s_detection/val/herdnet_format_512_0_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/2025_11_12/Fernandina_s_detection/val/crops_512_numNone_overlap0'

  albu_transforms:
#    ObjectAwareRandomCropEdgeBlackout:
#      height: 512
#      width: 512
#      p: 1.0
#      attempts: 10
#      edge_black_blobs: true
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

test:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/2025_11_12/Fernandina_fwk/val//herdnet_format.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/2025_11_12/Fernandina_fwk/val//Default'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

