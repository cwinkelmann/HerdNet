vizual_fn: null
visualiser: null
debug_visualiser: null


loss_evaluation: null
#loss_evaluation:
#  name: 'LossEvaluator'
#  select_mode: 'min'
#  validate_on: 'total_loss'


evaluator:
  name: 'P2PNetEvaluator'
  threshold: 100
  select_mode: 'max'
  validate_on: 'f1_score'
  kwargs:
    print_freq: 125


