


trainer: 'P2PNetTrainer'
epochs: 100
valid_freq: 1
print_freq: 225
batch_size: 5
val_batch_size: 1 # TODO this still does not work with higher batch sizes, maybe for the stitcher case

# optimizer: 'SGD'
optimizer: 'adamW'
lr: 0.001
backbone_lr: 0.001
head_lr: 0.0002
weight_decay: 0.001
weight_decay_backbone: 0.01
num_workers: 2
auto_lr:
  mode: 'max'
  patience: 5
  threshold: 1e-4
  threshold_mode: 'rel'
  cooldown: 10
  min_lr: 1e-7
  verbose: True
warmup_iters: 200

