
DensityAwareHerdNetLoss:
  print_name: 'DensityAwareHerdNetLoss'
  from_torch: False
  output_idx: 0
  target_idx: 0
  lambda_const: 1.0
  kwargs:
    alpha: 2
    beta: 4
    density_radius: 100


CrossEntropyLoss:
  print_name: 'ce_loss'
  from_torch: True
  output_idx: 1
  target_idx: 1
  lambda_const: 1.0
  background_class_weight: 0.1
  kwargs:
    reduction: 'mean'
    weight:
      - ${losses.CrossEntropyLoss.background_class_weight}
      - 5 # iguana_point
      - 0.1 # hard_negative


     # One weight for each class including the background
    #weight: [0.9, 0.001, 1.0] # From the notebook