wandb_notes: |
  fine tune on full iguana dataset with timm DLA34 model

defaults:
  - /losses: herdnet_iguana_high_recall
  - /datasets: ig_fernandina_no_aug_default
  - /training_settings: delplanque2022_evaluator_NoStitcher
  - /model: dinov3_fpn
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'x21_opt'
wandb_entity: 'karisu'
wandb_run: 'f1_fernandina_dinov3_fpn_no_aug'
wandb_tags: ["dino"]
seed: 1
device_name: null


training_settings:
  lr: 1.0e-04
  epochs: 150
  batch_size: 5

#
model:
  # HerdnetTimmDLA169_dr2_imagenet.yaml
#  load_from: /raid/cwinkelmann/herdnet/outputs/2025-11-13/18-24-40/best_model.pth
  kwargs:
    down_ratio: 4
    freeze_backbone: True
  input_resolution: [512, 512]

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

