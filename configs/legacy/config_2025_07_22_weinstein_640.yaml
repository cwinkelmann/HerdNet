# config for michigan bird dataset produces about f2 score 0.88

wandb_project: 'herdnet'
wandb_entity: 'karisu'
wandb_run: 'bird_weinstein_dr4_full_size_crop'
wandb_tags: ['weinstein','ortho', 'bird', 'dla34', 'dr4', 'train_full', 'val_full']
# /home/cwinkelmann/work/software-data-engineering-mac/data/ISAID/
seed: 1
device_name: 'cuda:1'

model:
  name: 'HerdNet'
  # work_dir: "./outputs/"
  from_torchvision: False
  # load_from: '/home/cwinkelmann/work/HerdNet/data/models/best_r0.99_p0.74_dla34/best_model_2.pth'
  # load_from: '/home/cwinkelmann/work/HerdNet/tools/outputs/20250611_ig_train_geospatial_val_pix4d_2025_06_11_dla_RUN_qcfixu05.pth'
  # load_from: null
  load_from: /home/cwinkelmann/work/Herdnet/data/models/20250722_bird_weinstein_dr4_edge_512_eoozwrmh.pth
  # resume_from: "/home/cwinkelmann/work/HerdNet/tools/outputs/2025-02-26/15-29-43/latest_model.pth"
  resume_from: null
  kwargs:
    num_layers: 34
    # backbone: 'dla'
    pretrained: True
    down_ratio: 4  # was two before
    head_conv: 64 # was 64
  freeze: null

losses:
  FocalLoss:
    print_name: 'focal_loss'
    from_torch: False
    output_idx: 0
    target_idx: 0
    lambda_const: 1.0
    kwargs:
      reduction: 'mean'
      normalize: False

  CrossEntropyLoss:
    print_name: 'ce_loss'
    from_torch: True
    output_idx: 1
    target_idx: 1
    lambda_const: 1.0
    kwargs:
      reduction: 'mean'
      weight: [2.0,   # 1 # iguana
               5.,    # 2 # hard negative
               15.,   # 3
               1.,    # 4
               0.1,   # 5
               0.1,   # 6
               1.0,   # 7
               0.1    # 8 # background
      ] # One weight for each class including the background
      #weight: [0.9, 0.001, 1.0] # From the notebook

datasets:
  img_size: [512, 512]
  anno_type: 'point'
  num_classes: 8 # One class more for the background
  collate_fn: null

  class_def:
#    1: 'Hartebeest'
#    2: 'Buffalo'
#    3: 'Kob'
#    4: 'Warthog'
#    5: 'Waterbuck'
#    6: 'Elephant'
#    7: 'Impala'
    1: 'Bird'
    2: 'hard_negative' # these next 6 are just there so I can use the pretrained model
    3: 'Kob'
    4: 'Warthog'
    5: 'Waterbuck'
    6: 'Elephant'
    7: 'Impala'




  train:
    # name: 'CSVDataset'
    name: 'CSVDataset'

    #csv_file: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_640/all_birds_train/detection_train_0_640/herdnet_format_640_0_crops.csv'
    #root_dir: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_640/all_birds_train/detection_train_0_640/crops_640_numNone_overlap0'

    csv_file: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_full_size/train/herdnet_format.csv'
    root_dir: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_full_size/train/Default'

    sampler: null

    albu_transforms:
      PadIfNeeded:
        min_height: 512
        min_width: 512
        always_apply: True
        border_mode: 4
        p: 1.0
      RandomScale:
        scale_limit: [0.8, 1.2]
        p: 0.5


      ShiftScaleRotate:
        shift_limit: 0.1
        scale_limit: 0.15
        rotate_limit: 45
        p: 0.5
        border_mode: 4
      Perspective:
        scale: [0.05, 0.15]
        p: 0.3
      Affine:
        scale: [0.9, 1.1]
        translate_percent: [0.1, 0.1]
        rotate: [-45, 45]
        shear: [-10, 10]
        p: 0.2

      HorizontalFlip:
        p: 0.2
      VerticalFlip:
        p: 0.2
      MotionBlur:
        p: 0.2
      RandomRotate90:
        p: 0.5
      RandomBrightnessContrast:
        brightness_limit: 0.2
        contrast_limit: 0.2
        p: 0.1
      Blur:
        blur_limit: 15
        p: 0.1
      ToGray:
        p: 0.1
      #      ShiftScaleRotate:
      #        shift_limit: 0.0625
      #        scale_limit: 0.1
      #        rotate_limit: 45
      #        p: 0.5
      #      Perspective:
      #        scale: 0.05
      #        p: 0.3
      HueSaturationValue:
        hue_shift_limit: 20
        sat_shift_limit: 30
        val_shift_limit: 20
        p: 0.1
      CLAHE:
        clip_limit: 2.0
        p: 0.1
      #      Solarize:
      #        threshold: 128
      #        p: 0.2
#      RandomCrop:
#        height: 512
#        width: 512
#        p: 1.0
#      Resize:
#        height: 512
#        width: 512
#        p: 1.0
      RandomCrop:
        height: 512
        width: 512
        p: 1.0
      Normalize:
        p: 1.0


    end_transforms:
      MultiTransformsWrapper:
        FIDT:
          num_classes: ${datasets.num_classes}
          down_ratio: ${model.kwargs.down_ratio}
        PointsToMask:
          radius: 2
          num_classes: ${datasets.num_classes}
          squeeze: True
          down_ratio: 32

  validate:
    # name: 'FolderDataset'
    name: 'CSVDataset'

    # csv_file: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_640/all_birds_val/detection_val_0_640/herdnet_format_640_0_crops.csv'
    # root_dir: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_640/all_birds_val/detection_val_0_640/crops_640_numNone_overlap0'

    csv_file: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_full_size/val/herdnet_format.csv'
    root_dir: '/home/cwinkelmann/work/Herdnet/data/weinstein_birds_full_size/val/padded_images'


# data/FLPC01-07_orthomosaic_herdnet/jpg_tiles
    albu_transforms:
#      RandomCrop:
#        height: 512
#        width: 512
#        p: 1.0
#      RandomCrop:
#        height: 512
#        width: 512
#        p: 1.0
#      Resize:
#        height: 512
#        width: 512
#        p: 1.0
      Normalize:
        p: 1.0

    end_transforms:
      DownSample:
        down_ratio: ${model.kwargs.down_ratio}
        anno_type: ${datasets.anno_type}

training_settings:
  trainer: 'Trainer'
  epochs: 150
  valid_freq: 5
  print_freq: 100
  batch_size: 50
  # optimizer: 'SGD'
  optimizer: 'adamW'
  lr: 1e-3
  weight_decay: 0.0005
  num_workers: 12
  auto_lr:
    mode: 'max'
    patience: 50
    threshold: 1e-4
    threshold_mode: 'rel'
    cooldown: 20
    min_lr: 1e-6
    verbose: True
  warmup_iters: 1000

  # vizual_fn: "model_vizual"
  vizual_fn: null


  evaluator:
    name: 'HerdNetEvaluator'
    threshold: 25
    select_mode: 'max'
    validate_on: 'f1_score'
    kwargs:
      print_freq: 50
      lmds_kwargs:
        kernel_size: [9, 9]
        adapt_ts: 0.3

  stitcher:
    name: 'HerdNetStitcher'
    kwargs:
      overlap: 120
      down_ratio: ${model.kwargs.down_ratio}
      up: False
      reduction: 'mean'

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

