wandb_notes: |
  """default Settings from eikelboom to herd counting on eikelboom 2019 dataset with timm DLA34 model"""
defaults:
  - /losses: herdnet_publication
  - /datasets: eikelboom2019_crop_train_crop_val_aug_default_overlap200
  - /training_settings: delplanque2022_evaluator_stitcher
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'x1_eikelboom_herdnet_experiment_reproduction'
wandb_entity: 'karisu'
wandb_run: 'x1_eikelboom_dla34_train_crop_eval_crop_overlap200_focal_4_1'
wandb_tags: ['timmDLA', 'eikelboom','dla34', 'default_setting', "exp1"]
seed: 1
device_name: null

#training_settings:
training_settings:
  epochs: 250
#  lr: 0.0001
  auto_lr:
    mode: 'max'
    patience: 25

losses:
  FocalLoss:
    kwargs:
      alpha: 4
      beta: 1


hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

