wandb_notes: |
  "train on random crops of floreana, evaluate on crops floreana images"
  "trained with dinov2_small"

defaults:
  - /losses: herdnet_winning
  - /datasets: iguana_all_winning_all_vs_fcd
  - /training_settings: delplanque2022_evaluator_stitcher_best
  - /model: Dinov2_small
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_iguana'
wandb_entity: 'karisu'
wandb_run: 'x5_iguana_winning_corr_dinoS_pub_train_full_eval_full_aug_all'
wandb_tags: ['floreana','dinov2', 'Dinov2_small', 'default_setting', "exp1", "eval_crop", "train_full", "corrected"]
seed: 1
device_name: null

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

