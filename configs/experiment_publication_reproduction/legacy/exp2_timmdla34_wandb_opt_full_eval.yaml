# The sweep resulted in no clear effect of any hyperparameter except for down_ratio and a bit of batch size.

defaults:
  - /losses: herdnet_publication
  - /datasets: delplanque2022
  - /training_settings: delplanque2022_evaluator
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_delplanque2022_full_eval'
wandb_entity: 'karisu'
wandb_run: 'timm_DLA34_hyp_optimization_dr16'
wandb_tags: ['timm', 'delplanque','dla34','dla' ,'boxcenter', 'default_setting', "exp2", "dr16"]
seed: 1
device_name: null


# Override specific parameters from included configs
model:
    kwargs:
        down_ratio: 16
training_settings:
    batch_size: 4
    evaluator:
      kwargs:
        lmds_kwargs:
          scale_factor: 2 # # dr=2 -> scale_factor 16, dr=4 -> 8, dr=8 -> 4, dr=16 -> 2 in the non patching case

losses:
  CrossEntropyLoss:
    background_class_weight: 20

  FocalLoss:
    kwargs:
     alpha: 4
     beta: 1

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

