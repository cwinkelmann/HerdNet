wandb_notes: |
  "train on random crops of floreana, evaluate on crops floreana images"
  "trained with Herdnet34_dr2_imagenet"

defaults:
  - /losses: herdnet_winning
  - /datasets: aed_all_winning
  - /training_settings: delplanque2022_evaluator_stitcher_best
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_aed'
wandb_entity: 'karisu'
wandb_run: 'x5_aed_winning_dla34_pub_train_full_eval_full_aug_all'
wandb_tags: ['floreana','dla', 'dla34', 'default_setting', "exp1", "eval_crop", "train_full"]
seed: 1
device_name: null

training_settings:
  lr: 1.0e-04

