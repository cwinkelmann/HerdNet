wandb_notes: |
  """default Settings from From crowd to herd counting on eikelboom 2019 dataset with timm Dinov2 Small model"""
defaults:
  - /losses: herdnet_publication
  - /datasets: eikelboom2019_full_train_full_val_aug_all
  - /training_settings: delplanque2022_evaluator_stitcher
  - /model: Dinov2_small
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'x2_eikelboom'
wandb_entity: 'karisu'
wandb_run: 'x2_eikelboom_dinoS_train_all_eval_crop_publication'
wandb_tags: ['timmDLA', 'eikelboom','dinov2_S', 'default_setting', "exp2"]
seed: 1
device_name: null

training_settings:
  lr: 0.0001
  epochs: 100

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

