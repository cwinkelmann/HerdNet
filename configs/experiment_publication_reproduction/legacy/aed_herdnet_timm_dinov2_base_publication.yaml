wandb_notes: |
  """default Settings from From crowd to herd counting on aed with timm Dinov2_base model"""
defaults:
  - /losses: herdnet_publication
  - /datasets: aed
  - /training_settings: delplanque2022_val_loss
  - /model: Dinov2_base
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_aed'
wandb_entity: 'karisu'
wandb_run: 'timm_Dinov2_base_publication_setting'
wandb_tags: ['timmDINOV2', 'aed','Dinov2_base', 'default_setting', "exp1"]
seed: 1
device_name: null

model:
  freeze: False # Freeze the model, if you want to train only the heads
  freeze_backbone: True # Freeze the backbone, if you want to train only the heads
#  load_from: /raid/cwinkelmann/herdnet/outputs/2025-09-12/09-31-18/best_loss_model.pth

training_settings:
  lr: 0.00001

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

