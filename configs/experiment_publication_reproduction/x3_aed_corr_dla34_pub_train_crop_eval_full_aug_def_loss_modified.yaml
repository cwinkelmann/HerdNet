wandb_notes: |
  "training on crops with default augmentations"

defaults:
  - /losses: herdnet_winning
  - /datasets: aed_all_winning_train_crop_aug_default
  - /training_settings: delplanque2022_evaluator_stitcher_best
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_aed'
wandb_entity: 'karisu'
wandb_run: 'x3_aed_corr_dla34_pub_train_crop_eval_full_aug_def_loss_modified'
wandb_tags: ['floreana','dla', 'dla34', 'default_setting', "exp1", "eval_crop", "train_full"]
seed: 1
device_name: null


model:
  load_from: /raid/cwinkelmann/herdnet/outputs/2025-09-15/07-26-40/best_model.pth # https://wandb.ai/karisu/herdnet_aed/runs/0vww5fp9/logs # dla34, same config as this, there was the loss the default loss config

training_settings:
  lr: 1.0e-04
losses:
  FocalLoss:
    kwargs:
      alpha: 4
      beta: 1

