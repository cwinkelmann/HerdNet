# Compare Hyperparameters for timmdla34

program: ./tools/train_cli.py
method: bayes

project: 'iguana_train_sweep'
entity: 'karisu'

metric:
  goal: maximize
  name: f1_score


# Add early termination
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3

parameters:
  # Reduce training epochs for sweep
  model.kwargs.down_ratio:
    values: [ 4 ]

  training_settings.batch_size:
    values: [ 32, 16 ]

  training_settings.optimizer:
    values: [ "adamW", "adam", "SGD" ]

  training_settings.evaluator.kwargs.lmds_kwargs.adapt_ts:
    values: [ 0.3, 0.5, 0.7 ]

  training_settings.epochs:
    values: [ 50 ]

#  training_settings.lr:
#    distribution: log_uniform_values
#    min: 0.00001
#    max: 0.01

  training_settings.weight_decay:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001


  losses.FocalLoss.kwargs.alpha:
    values: [ 0.5, 1, 2, 3, 4 ]
  losses.FocalLoss.kwargs.beta:
    values: [ 0.5, 1, 2, 3, 4, 5, 6 ]

  losses.CrossEntropyLoss.background_class_weight:
    values: [ 0.1, 0.5, 1, 2 ]
  losses.CrossEntropyLoss.class_1_weight:
    values: [ 0.5, 1, 2, 3, 4, 5, 6 ]



command:
  - ${env}
  - python
  - ${program}
  - --config-name=x15_2_hyper_parameter_optimisation_floreana
  - --config-path=../configs/experiment_publication_reproduction
  - ${args_no_hyphens}