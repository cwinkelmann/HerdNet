# Training settings without visualisation

trainer: 'Trainer'
epochs: 100
valid_freq: 1
print_freq: 525
batch_size: 4
# optimizer: 'SGD'
optimizer: 'adam'
lr: 1.0e-03
weight_decay: 0.005
num_workers: 2
auto_lr:
  mode: 'max'
  # factor: 0.5
  patience: 10
  threshold: 1e-4
  threshold_mode: 'rel'
  cooldown: 10
  min_lr: 1e-7
  verbose: True
warmup_iters: 100

# vizual_fn: "model_vizual"
#vizual_fn: visualize_sample
vizual_fn: null
visualiser: null

loss_evaluation:
  name: 'LossEvaluator'
  select_mode: 'min'
  validate_on: 'total_loss'

evaluator:
  name: 'HerdNetEvaluator'
  threshold: 100
  select_mode: 'max'
  validate_on: 'f1_score'
  kwargs:
    print_freq: 125
    lmds_kwargs:
      kernel_size: [9, 9]
      adapt_ts: 0.3
      scale_factor: 16 # # dr=2 -> scale_factor 16, dr=4 -> 8, dr=8 -> 4, dr=16 -> 2 in the non patching case TODO fix this so it is 8 for single use and 1 for patching
#      scale_factor_patching: 1
#      up: True # do I need this
#
#stitcher:
#  name: 'HerdNetStitcher'
#  kwargs:
#    overlap: 120
#    down_ratio: ${model.kwargs.down_ratio}
#    up: False
#    reduction: 'mean'
stitcher: null