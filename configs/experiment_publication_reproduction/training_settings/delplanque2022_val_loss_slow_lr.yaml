trainer: 'Trainer'
epochs: 100
valid_freq: 1
print_freq: 125
batch_size: 4
# optimizer: 'SGD'
optimizer: 'adam'
lr: 0.00001
weight_decay: 0.0005
num_workers: 12
auto_lr:
  mode: 'max'
  patience: 15
  threshold: 1e-4
  threshold_mode: 'rel'
  cooldown: 10
  min_lr: 1e-7
  verbose: True
warmup_iters: 1000

# vizual_fn: "model_vizual"
vizual_fn: visualize_sample
visualiser:
  name: 'HeatMapVisualizer'
  output_dir: ./visualizations


loss_evaluation:
  name: 'LossEvaluator'
  select_mode: 'min'
  validate_on: 'total_loss'

evaluator: null
