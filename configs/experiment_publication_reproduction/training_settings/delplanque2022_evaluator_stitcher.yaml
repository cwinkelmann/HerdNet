

# Configuration which evaluates the loss and the end metric (F1 score) on the validation set.


trainer: 'Trainer'
epochs: 50
valid_freq: 1
print_freq: 225
batch_size: 10
# optimizer: 'SGD'
optimizer: 'adam'
lr: 0.001
weight_decay: 0.005
num_workers: 2
auto_lr:
  mode: 'max'
  patience: 15
  threshold: 1e-4
  threshold_mode: 'rel'
  cooldown: 10
  min_lr: 1e-6
  verbose: True
warmup_iters: 100

# vizual_fn: "model_vizual"
vizual_fn: visualize_sample
visualiser:
  name: 'HeatMapVisualizer'
  output_dir: ./visualizations


loss_evaluation:
  name: 'LossEvaluator'
  select_mode: 'min'
  validate_on: 'total_loss'

evaluator:
  name: 'HerdNetEvaluator'
  threshold: 100
  select_mode: 'max'
  validate_on: 'f1_score'
  kwargs:
    print_freq: 5
    lmds_kwargs:
      kernel_size: [9, 9]
      adapt_ts: 0.3
      scale_factor: 1 # was 8 in the non patching case TODO fix this so it is 8 for single use and 1 for patching
      # scale_factor_patching: 1
      up: True

stitcher:
  name: 'HerdNetStitcher'
  kwargs:
    overlap: 120
    down_ratio: ${model.kwargs.down_ratio}
    up: False
    reduction: 'mean'
#stitcher: null