# The sweep resulted in no clear effect of any hyperparameter except for down_ratio and a bit of batch size.

defaults:
  - /losses: herdnet_publication
  - /datasets: floreana_crop_train_corrected_crop_val_corrected_aug_all
  - /training_settings: delplanque2022_val_loss
#  - /training_settings: delplanque2022_evaluator_stitcher
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_notes: |
  sweep for the best augmentation combination for timm_DLA34 with delplanque2022 settings on floreana corrected train and val
wandb_project: 'herdnet_delplanque2022'
wandb_entity: 'karisu'
wandb_run: 'timm_DLA34_hyp_optimization_dr2'
wandb_tags: ['timm', 'delplanque','dla34','dla' ,'boxcenter', 'default_setting', "exp2", "dr2"]
seed: 1
device_name: null


# Override specific parameters from included configs
model:
    kwargs:
        down_ratio: 2
training_settings:
    batch_size: 8



hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

