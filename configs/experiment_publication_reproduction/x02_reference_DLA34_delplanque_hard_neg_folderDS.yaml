wandb_notes: |
  reference DLA34 model on delplanque dataset
  

defaults:
  - /losses: herdnet_publication
  - /datasets: delplanque2022_overlap160_hard_neg_folderDS
  - /training_settings: delplanque2022_evaluator_quick
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'x02_referenee'
wandb_entity: 'karisu'
wandb_run: 'x02_reference_RefDLA34_delplanque_folder_ds'
wandb_tags: ['dla']
seed: 1
device_name: null

training_settings:
  batch_size: 32
  lr: 1.0e-04
  num_workers: 24

model:
  load_from: /raid/cwinkelmann/herdnet/outputs/2025-10-24/13-37-43/best_model.pth # https://wandb.ai/karisu/x02_referenee/runs/rae66p5g/logs?nw=nwuserkarisu

hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

