# The sweep resulted in no clear effect of any hyperparameter except for down_ratio and a bit of batch size.

defaults:
  - /losses: herdnet_publication
  - /datasets: delplanque2022
  - /training_settings: delplanque2022_evaluator
  - /model: HerdNetTimmDLA34_dr2_imagenet
  - _self_  # Include this config's content

wandb_flag: True
wandb_project: 'herdnet_delplanque2022_full_eval'
wandb_entity: 'karisu'
wandb_run: 'timm_DLA34_hyp_optimization_dr4'
wandb_tags: ['timm', 'delplanque','dla34','dla' ,'boxcenter', 'default_setting', "exp2", "dr4", "focal_loss_opt"]
seed: 1
device_name: null


# Override specific parameters from included configs
model:
    kwargs:
        down_ratio: 4
training_settings:
    batch_size: 4
    evaluator:
      kwargs:
        lmds_kwargs:
          scale_factor: 8 # # dr=2 -> scale_factor 16, dr=4 -> 8, dr=8 -> 4, dr=16 -> 2 in the non patching case

losses:
  CrossEntropyLoss:
    background_class_weight: 20

  FocalLoss:
    kwargs:
      alpha: 1 # default 2 # Lower alpha = more focus on hard examples
      beta: 5 # default 4 # Higher beta means less penalty on easy negatives

      density_weight: "linear" # "linear", "squared", "cubic"
      normalize: False
      weights: [0.3, 0.7]
hydra:
  run:
    dir: /raid/cwinkelmann/herdnet/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

