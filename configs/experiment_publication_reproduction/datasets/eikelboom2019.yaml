# Delplanque et al. 2022 dataset reference with simple augmentations

img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 7 # One class more for the background
collate_fn: null


class_def:
  1: 'Alcelaphinae'
  2: 'Buffalo'
  3: 'Kob'
  4: 'Warthog'
  5: 'Waterbuck'
  6: 'Elephant'

train:
  name: 'CSVDataset'

  csv_file: '/home/cwinkelmann/work/Herdnet/data/eikelboom/eikelboom_train/detection_train_0_512/herdnet_format_512_0_crops.csv'
  root_dir: '/home/cwinkelmann/work/Herdnet/data/eikelboom/eikelboom_train/detection_train_0_512/crops_512_numNone_overlap0'

  sampler: null
  augmentation_multiplier: 1

  albu_transforms:
    HorizontalFlip:
      p: 0.5
    MotionBlur:
      p: 0.5
    Normalize:
      p: 1.0

  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 1
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: '/home/cwinkelmann/work/Herdnet/data/eikelboom/eikelboom_val/detection_val_0_512/herdnet_format_512_0_crops.csv'
  root_dir: '/home/cwinkelmann/work/Herdnet/data/eikelboom/eikelboom_val/detection_val_0_512/crops_512_numNone_overlap0'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

