# Delplanque et al. 2022 dataset reference with simple augmentations ULG/MIRUU5_2023 https://dataverse.uliege.be/dataset.xhtml?persistentId=doi:10.58119/ULG/MIRUU5


img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 8 # One class more for the background
collate_fn: null


class_def:
  1: 'Alcelaphinae'
  2: 'Buffalo'
  3: 'Kob'
  4: 'Warthog'
  5: 'Waterbuck'
  6: 'Elephant'
  7: 'hard_negative' # these next 6 are just there so I can use the pretrained model

train:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/delplanque/general_dataset/hasty_style/Delplanque2022_512_overlap_160_ebFalse/delplanque_train_with_hard_negatives/train/herdnet_format.csv'
  root_dir: '/raid/cwinkelmann/training_data/delplanque/general_dataset/hasty_style/Delplanque2022_512_overlap_160_ebFalse/delplanque_train_with_hard_negatives/train/Default'

  sampler: null
  augmentation_multiplier: 20

  albu_transforms:
    ObjectAwareRandomCrop:
      height: 512
      width: 512
      p: 1.0
      always_apply: True
      empty_probability: 0.15
    HorizontalFlip:
      p: 0.5
    MotionBlur:
      p: 0.5
    Normalize:
      p: 1.0

  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 1
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/delplanque/general_dataset/hasty_style/Delplanque2022_512_overlap_160_ebFalse/delplanque_val/val/herdnet_format.csv'
  root_dir: '/raid/cwinkelmann/training_data/delplanque/general_dataset/hasty_style/Delplanque2022_512_overlap_160_ebFalse/delplanque_val/val/Default'

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

test:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/delplanque/general_dataset/hasty_style/Delplanque2022_512_overlap_0/delplanque_test/detection_test_0_512/herdnet_format_512_0_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/delplanque/general_dataset/hasty_style/Delplanque2022_512_overlap_0/delplanque_test/detection_test_0_512/crops_512_numNone_overlap0'