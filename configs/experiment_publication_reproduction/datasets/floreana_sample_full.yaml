# Iguana head marks marks on Low quality data, i.e. Drone Deploy orthomosaics

img_size: [512, 512]
anno_type: 'point'
num_classes: 7 # One class more for the background
collate_fn: null

class_def:
  1: 'iguana_point'
  2: 'hard_negative' # these next 6 are just there so I can use the pretrained model
  3: 'Kob'
  4: 'Warthog'
  5: 'Waterbuck'
  6: 'Elephant'
#  7: 'Impala'




train:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/Fernandina_s_single_sample/train/herdnet_format.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/Fernandina_s_single_sample/train/Default'

  sampler: null
  augmentation_multiplier: 10

  albu_transforms:
    ObjectAwareRandomCrop:
      height: 1000
      width: 1000
      p: 1.0
      attempts: 10
      edge_black_blobs: true
    RandomScale:
      scale_limit:
        - 0.8
        - 1.2
      p: 0.5
    ShiftScaleRotate:
      shift_limit: 0.1
      scale_limit: 0.15
      rotate_limit: 45
      p: 0.5
      border_mode: 4
    Perspective:
      scale:
        - 0.05
        - 0.15
      p: 0.3
    Affine:
      scale:
        - 0.9
        - 1.1
      translate_percent:
        - 0.1
        - 0.1
      rotate:
        - -45
        - 45
      shear:
        - -10
        - 10
      p: 0.2
    HorizontalFlip:
      p: 0.2
    VerticalFlip:
      p: 0.2
    MotionBlur:
      p: 0.2
    RandomRotate90:
      p: 0.5
    RandomBrightnessContrast:
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.1
    Blur:
      blur_limit: 15
      p: 0.1
    ToGray:
      p: 0.1
    ObjectAwareRandomCropEdgeBlackout:
      height: 512
      width: 512
      p: 1.0
      attempts: 10
      edge_black_blobs: true
    Normalize:
      p: 1.0


  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: True
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/iguana/Fernandina_s_single_sample/train/herdnet_format.csv'
  root_dir: '/raid/cwinkelmann/training_data/iguana/Fernandina_s_single_sample/train/Default'


# data/FLPC01-07_orthomosaic_herdnet/jpg_tiles
  albu_transforms:
#      RandomCrop:
#        height: 512
#        width: 512
#        p: 1.0
    Resize:
      height: 512
      width: 512
      p: 1.0
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}