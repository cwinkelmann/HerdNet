# The Dataset which contains the optimised hyperparameters from the hyperparameter optimization
# https://wandb.ai/karisu/herdnet_iguana_sweep_aug_2/sweeps/6yzvbjce?nw=nwuserkarisu
#  https://wandb.ai/karisu/ig_Floreana_learning_curve/
img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 8 # One class more for the background
collate_fn: null

class_def:
  1: 'iguana_point'
  2: 'hard_negative' # these next 6 are just there so I can use the pretrained model
  3: 'Kob'
  4: 'Warthog'
  5: 'Waterbuck'
  6: 'Elephant'
  7: '-'

train:
  name: 'CSVDataset'

  csv_file: "/home/cwinkelmann/work/Herdnet/data/2025_10_11/All_detection_extend/train/herdnet_format_512_320_crops.csv"
  root_dir: "/home/cwinkelmann/work/Herdnet/data/2025_10_11/All_detection_extend/train/crops_512_numNone_overlap320"


  sampler: null
  augmentation_multiplier: 1



  albu_transforms:
    HorizontalFlip:
      p: 0.5
    MotionBlur:
      p: 0.5
    Normalize:
      p: 1.0



  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 1
      PointsToMask:
        radius: 1
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: "/home/cwinkelmann/work/Herdnet/data/2025_10_11/Fernandina_fwk/val/herdnet_format_512_0_crops.csv"
  root_dir: "/home/cwinkelmann/work/Herdnet/data/2025_10_11/Fernandina_fwk/val/crops_512_numNone_overlap0"

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

