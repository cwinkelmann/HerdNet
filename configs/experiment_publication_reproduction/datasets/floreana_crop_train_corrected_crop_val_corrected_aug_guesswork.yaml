# The Dataset which contains the optimised hyperparameters from the hyperparameter optimization
# https://wandb.ai/karisu/herdnet_iguana_sweep_aug_2/sweeps/6yzvbjce?nw=nwuserkarisu
#  https://wandb.ai/karisu/ig_Floreana_learning_curve/
img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 2 # One class more for the background
collate_fn: null

class_def:
  1: 'iguana_point'


train:
  name: 'CSVDataset'

#  csv_file: "/home/cwinkelmann/work/Herdnet/data/2025_07_10_Floreana_val_corrected/Floreana_detection_corrected/train/herdnet_format_512_0_crops.csv"
  csv_file: "/raid/cwinkelmann/training_data/iguana/2025_10_11/Floreana_detection/train/herdnet_format_512_0_crops.csv"
#  root_dir: "/home/cwinkelmann/work/Herdnet/data/2025_07_10_Floreana_val_corrected/Floreana_detection_corrected/train/crops_512_numNone_overlap0"
  root_dir: "/raid/cwinkelmann/training_data/iguana/2025_10_11/Floreana_detection/train/crops_512_numNone_overlap0"


  sampler: null
  augmentation_multiplier: 1



  albu_transforms:
    # Keep the geometric transformations that help with different viewpoints
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    RandomRotate90:
      p: 0.5

    # Add slight rotation for natural variation in drone angle
    Rotate:
      limit: 15  # Small angles only - drones don't tilt much
      p: 0.3
      border_mode: 4

    # Simulate different altitudes/zoom levels
    RandomScale:
      scale_limit:
        - 0.9
        - 1.1
      p: 0.3

    # Simulate different lighting conditions (sun angle, clouds)
    RandomBrightnessContrast:
      brightness_limit: 0.2  # Keep moderate - too much hurts
      contrast_limit: 0.2
      p: 0.3

    # Simulate slight motion blur from drone movement
    MotionBlur:
      blur_limit: 5  # Keep subtle
      p: 0.2

    # Simulate different times of day / shadow conditions
    RandomShadow:
      shadow_roi:
        - 0
        - 0.5
        - 1
        - 1
      num_shadows_lower: 1
      num_shadows_upper: 2
      shadow_dimension: 5
      p: 0.15

    CenterCrop:
      height: 512
      width: 512
      p: 1.0

    Normalize:
      p: 1.0



  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 1
      PointsToMask:
        radius: 1
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: "/raid/cwinkelmann/training_data/iguana/2025_10_11/Floreana_detection/val/herdnet_format_512_0_crops.csv"
  root_dir: "/raid/cwinkelmann/training_data/iguana/2025_10_11/Floreana_detection/val/crops_512_numNone_overlap0"

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

