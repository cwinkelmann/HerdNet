# The Dataset which contains the optimised hyperparameters from the hyperparameter optimization
# https://wandb.ai/karisu/herdnet_iguana_sweep_aug_2/sweeps/6yzvbjce?nw=nwuserkarisu
#  https://wandb.ai/karisu/ig_Floreana_learning_curve/
img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 3 # One class more for the background
collate_fn: null

class_def:
  1: 'iguana_point'
  2: 'hard_negative' # these next 6 are just there so I can use the pretrained model
#  3: 'Kob'
#  4: 'Warthog'
#  5: 'Waterbuck'
#  6: 'Elephant'
#  7: '-'

train:
  name: 'CSVDataset'

#  csv_file: "/home/cwinkelmann/work/Herdnet/data/2025_07_10_Floreana_val_corrected/Floreana_detection_corrected/train/herdnet_format_512_0_crops.csv"
  csv_file: "/raid/cwinkelmann/training_data/iguana/2025_09_28_orthomosaic_data/Fernandina_s_detection_il_38/train/herdnet_format_512_0_crops.csv"
#  root_dir: "/home/cwinkelmann/work/Herdnet/data/2025_07_10_Floreana_val_corrected/Floreana_detection_corrected/train/crops_512_numNone_overlap0"
  root_dir: "/raid/cwinkelmann/training_data/iguana/2025_09_28_orthomosaic_data/Fernandina_s_detection_il_38/train/crops_512_num38_overlap0"


  sampler: null
  augmentation_multiplier: 1



  albu_transforms:
    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    Normalize:
      p: 1.0

  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 1
      PointsToMask:
        radius: 1
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32


validate:
  name: 'CSVDataset'

  csv_file: "/raid/cwinkelmann/training_data/iguana/2025_09_28_orthomosaic_data/Fernandina_s_detection/val/herdnet_format_512_0_crops.csv"
  root_dir: "/raid/cwinkelmann/training_data/iguana/2025_09_28_orthomosaic_data/Fernandina_s_detection/val/crops_512_numNone_overlap0"

  albu_transforms:
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

