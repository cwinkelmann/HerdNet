# Training Data is corrected here by Double Checking them by predictions from a model which are labeles as false positves

img_size: [512, 512] # The size of how the images should be processed, mostly important for the tiled prediction
anno_type: 'point'
num_classes: 8 # One class more for the background
collate_fn: null

class_def:
  1: 'Elephant'
  2: 'a'
  3: 'b'
  4: 'c'
  5: 'd'
  6: 'e'
  7: 'f'

train:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/AED/AED_512_overlap_0/aed_train/train/herdnet_format_512_0_crops.csv'
  root_dir: '/raid/cwinkelmann/training_data/AED/AED_512_overlap_0/aed_train/train/crops_512_numNone_overlap0'


  sampler: null
  augmentation_multiplier: 10

  albu_transforms:

    HorizontalFlip:
      p: 0.5
    VerticalFlip:
      p: 0.5
    Normalize:
      p: 1.0
  end_transforms:
    MultiTransformsWrapper:
      FIDT:
        num_classes: ${datasets.num_classes}
        down_ratio: ${model.kwargs.down_ratio}
        radius: 2
      PointsToMask:
        radius: 2
        num_classes: ${datasets.num_classes}
        squeeze: true
        down_ratio: 32

validate:
  name: 'CSVDataset'

  csv_file: '/raid/cwinkelmann/training_data/AED/AED_512_overlap_0/aed_test/test/herdnet_format.csv'
  root_dir: '/raid/cwinkelmann/training_data/AED/AED_512_overlap_0/aed_test/test/Default'

  albu_transforms:
    ObjectAwareRandomCropEdgeBlackout:
      height: 512
      width: 512
      p: 1.0
      attempts: 10
      edge_black_blobs: true
    Normalize:
      p: 1.0

  end_transforms:
    DownSample:
      down_ratio: ${model.kwargs.down_ratio}
      anno_type: ${datasets.anno_type}

