[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animaloc"
version = "0.3.1"
description = "Animal localization in aerial imagery using PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Christian Winkelmann", email = "christian.winkelmann@gmail.com"},
    {name = "Alexandre Delplanque", email = "alexandre.delplanque@uliege.be"},
]
keywords = ["animal", "localization", "detection", "deep learning", "pytorch"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "timm==1.0.22",
    "albumentations==1.0.3",
    "hydra-core==1.3.2",
    "opencv-python==4.10.0.84",
    "pillow==10.4.0",
    "scikit-image",
    "scikit-learn",
    "wandb==0.24.1",
    "gdown==5.2.0",
    "matplotlib==3.10.8",
    "tqdm==4.67.1",
    "loguru==0.7.3",
    "seaborn==0.13.2",
    "numpy==2.4.1",
    "scipy==1.16.0",
    "pandas==2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
tracking = [
    "wandb>=0.20",
]
all = [
    "animaloc[dev,tracking]",
]

[project.urls]
Homepage = "https://github.com/cwinkelmann/HerdNet"

[tool.setuptools.packages.find]
where = ["."]
include = ["animaloc*"]