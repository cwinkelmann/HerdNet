[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animaloc"
version = "0.3.1"
description = "Animal localization in aerial imagery using PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Christian Winkelmann", email = "christian.winkelmann@gmail.com"},
    {name = "Alexandre Delplanque", email = "alexandre.delplanque@uliege.be"},
]
keywords = ["animal", "localization", "detection", "deep learning", "pytorch"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "albumentations>=1.0.3",
    "hydra-core>=1.3",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "scikit-image",
    "scikit-learn",
    "matplotlib>=3.10",
    "tqdm>=4.67",
    "loguru>=0.7",
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
tracking = [
    "wandb>=0.20",
]
all = [
    "animaloc[dev,tracking]",
]

[project.urls]
Homepage = "https://github.com/cwinkelmann/HerdNet"

[tool.setuptools.packages.find]
where = ["."]
include = ["animaloc*"]