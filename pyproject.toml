[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animaloc"
version = "0.3.2"
description = "Animal localization in aerial imagery using PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Christian Winkelmann", email = "christian.winkelmann@gmail.com"},
    {name = "Alexandre Delplanque", email = "alexandre.delplanque@uliege.be"},
]
keywords = ["animal", "localization", "detection", "deep learning", "pytorch"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "timm>=1.0,<2",
    "albumentations>=1.0,<2",
    "hydra-core>=1.3,<2",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scikit-image",
    "scikit-learn",
    "gdown>=5.0",
    "matplotlib>=3.7",
    "tqdm>=4.60",
    "loguru>=0.7",
    "seaborn>=0.13",
    "numpy>=2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
tracking = [
    "wandb>=0.18",
]
notebook = [
    "jupyterlab",
    "ipywidgets",
]
viz = [
    "fiftyone",
]
all = [
    "animaloc[dev,tracking,notebook,viz]",
]

[project.urls]
Homepage = "https://github.com/cwinkelmann/HerdNet"

[tool.setuptools.packages.find]
where = ["."]
include = ["animaloc*"]