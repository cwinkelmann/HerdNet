name: Install & Smoke Test

on:
  push:
    branches: [main, dinov3]
  pull_request:
    branches: [main]

jobs:
  pip-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache HuggingFace test data
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: hf-test-data-v1

      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install animaloc
        run: pip install -e ".[dev]"

      - name: Verify import
        run: python -c "import animaloc; print(f'animaloc imported OK')"

      - name: Verify torch integration
        run: |
          python -c "
          import torch
          from animaloc.models import HerdNet
          model = HerdNet(num_classes=3, down_ratio=2)
          x = torch.randn(1, 3, 512, 512)
          out = model(x)
          print(f'HerdNet forward pass OK, output shapes: {[o.shape for o in out]}')
          "

      - name: Run training tests (DLA34 variants)
        run: pytest tests/test_train.py -v --tb=short -x -k "not convnext"

  uv-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache HuggingFace test data
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: hf-test-data-v1

      - name: Install with uv
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"

      - name: Verify import
        run: |
          source .venv/bin/activate
          python -c "import animaloc; print('animaloc imported OK')"

      - name: Verify torch integration
        run: |
          source .venv/bin/activate
          python -c "
          import torch
          from animaloc.models import HerdNet
          model = HerdNet(num_classes=3, down_ratio=2)
          x = torch.randn(1, 3, 512, 512)
          out = model(x)
          print(f'HerdNet forward pass OK, output shapes: {[o.shape for o in out]}')
          "

      - name: Run training tests (DLA34 variants)
        run: |
          source .venv/bin/activate
          pytest tests/test_train.py -v --tb=short -x -k "not convnext"

  conda-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          activate-environment: herdnet
          auto-activate-base: false

      - name: Cache HuggingFace test data
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: hf-test-data-v1

      - name: Install PyTorch via conda
        shell: bash -el {0}
        run: conda install pytorch torchvision cpuonly -c pytorch -y

      - name: Install animaloc via pip in conda env
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Verify import
        shell: bash -el {0}
        run: python -c "import animaloc; print('animaloc imported OK')"

      - name: Verify torch integration
        shell: bash -el {0}
        run: |
          python -c "
          import torch
          from animaloc.models import HerdNet
          model = HerdNet(num_classes=3, down_ratio=2)
          x = torch.randn(1, 3, 512, 512)
          out = model(x)
          print(f'HerdNet forward pass OK, output shapes: {[o.shape for o in out]}')
          "

      - name: Run training tests (DLA34 variants)
        shell: bash -el {0}
        run: pytest tests/test_train.py -v --tb=short -x -k "not convnext"
