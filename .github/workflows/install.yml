name: Install & Smoke Test

on:
  push:
    branches: [main, dinov3]
  pull_request:
    branches: [main]

jobs:
  # ── Install + fast tests across all environments ──────────────────────
  pip-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install animaloc
        run: pip install -e ".[dev]"

      - name: Run install tests
        run: pytest tests/test_install.py -v --tb=short

  uv-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install with uv
        run: |
          uv venv --python ${{ matrix.python-version }}
          source .venv/bin/activate
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev]"

      - name: Run install tests
        run: |
          source .venv/bin/activate
          pytest tests/test_install.py -v --tb=short

  conda-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          activate-environment: herdnet
          auto-activate-base: false

      - name: Install PyTorch via conda
        shell: bash -el {0}
        run: conda install pytorch torchvision cpuonly -c pytorch -y

      - name: Install animaloc via pip in conda env
        shell: bash -el {0}
        run: pip install -e ".[dev]"

      - name: Run install tests
        shell: bash -el {0}
        run: pytest tests/test_install.py -v --tb=short

  # ── Training tests: run once after all installs pass ──────────────────
  training:
    needs: [pip-install, uv-install, conda-install]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache HuggingFace test data
        uses: actions/cache@v4
        with:
          path: tests/.cache
          key: hf-test-data-v1

      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install animaloc
        run: pip install -e ".[dev]"

      - name: Run all tests (including slow training)
        run: pytest tests/test_train.py tests/test_pretrained.py -v --tb=short -m "" -x
